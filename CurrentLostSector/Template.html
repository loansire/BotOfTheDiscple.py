<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secteur Oublié de la semaine</title>
    <link rel="icon" href="https://www.bungie.net/common/destiny2_content/icons/DestinyActivityModeDefinition_7d11acd7d5a3daebc0a0c906452932d6.png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <img alt="Background Image" class="background-image" src="https://www.bungie.net/img/destiny_content/pgcr/europa-lost-sector-shear.jpg">
        <div class="overlay"></div>

        <div class="top-title">
            <div class="background-image-container">
                <img alt="Sector-Icon" class="toptitle-background-image" src="https://www.bungie.net/common/destiny2_content/icons/DestinyActivityModeDefinition_7d11acd7d5a3daebc0a0c906452932d6.png"/>
            </div>
            <p class="activity-type animated fadeInRight delay-1">SECTEUR OUBLIE</p>
            <h1 class="activity-name animated fadeInRight delay-2">ACTIVITY-NAME</h1>
            <p class="activity-description animated fadeInRight delay-3">Place - Destination</p>
        </div>

        <div class="reward-section">
            <div class="reward-title">RÉCOMPENSES (EN SOLO)</div>
            <div class="reward-list">
                <img style="background-color:rgba(200,163,90,255);" src="Img_reward_2" alt="Image 2">
                <span>Nom_Reward_2<br/><span class="small-text">rarity</span></span>
                <img src="Img_reward_1" alt="Image 1">
                <span>Nom_Reward_1<br/><span class="small-text">rarity</span></span>
                <img src="Img_reward_3" alt="Image 3">
                <span>Nom_Reward_3<br/><span class="small-text">rarity</span></span>
            </div>
        </div>

        <div class="lostSector-info">
            <div class="Expert-section">
            </div>
            <div class="Master-section">
            </div>
        </div>
    </div>
</body>
</html>
