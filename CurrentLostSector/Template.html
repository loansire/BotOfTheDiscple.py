<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secteur Oublié de la semaine</title>
    <link rel="icon" href="https://www.bungie.net/common/destiny2_content/icons/DestinyActivityModeDefinition_7d11acd7d5a3daebc0a0c906452932d6.png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <img id="sector_background" alt="Background Image" class="background-image" src="https://www.bungie.net/img/destiny_content/pgcr/europa-lost-sector-shear.jpg">
        <div class="overlay"></div>

        <div class="top-title">
            <div class="background-image-container">
                <img id="Sector-Icon" alt="Sector-Icon" class="toptitle-background-image" src="https://www.bungie.net/common/destiny2_content/icons/DestinyActivityModeDefinition_7d11acd7d5a3daebc0a0c906452932d6.png"/>
            </div>
            <p id="activity_type" class="activity-type animated fadeInRight delay-1">SECTEUR OUBLIE</p>
            <h1 id="activity_name" class="activity-name animated fadeInRight delay-2">ACTIVITY-NAME</h1>
            <p id="activity_description" class="activity-description animated fadeInRight delay-3">Place - Destination</p>
        </div>

        <div class="reward-section">
            <div class="reward-title">RÉCOMPENSES (EN SOLO)</div>
            <div class="reward-list">
                <img id="reward_icon_2" style="background-color:rgba(200,163,90,255);" src="https://www.bungie.net/common/destiny2_content/icons/3e6a698e1a8a5fb446fdcbf1e63c5269.png" alt="Image 2">
                <span id="reward_name_2">Engramme<br/>exotique<br/><span id="rarity_2" class="small-text">(Rare)</span></span>
                <img id="reward_icon_1" src="https://www.bungie.net/common/destiny2_content/icons/a0ac992c9980ec97c3e40a0b6cdd409c.jpg" alt="Image 1">
                <span id="reward_name_1">Arme<br/>légendaire<br/><span id="rarity_1" class="small-text">(peu commune)</span></span>
                <img id="reward_icon_3" src="https://www.bungie.net/common/destiny2_content/icons/0a4eb695ed55b4e720ddc401460cc0f9.jpg" alt="Image 3">
                <span id="reward_name_3">Matrices<br/>d'amélioration<br/><span id="rarity_3" class="small-text">(peu commun)</span></span>
            </div>
        </div>
    </div>
</body>
</html>
