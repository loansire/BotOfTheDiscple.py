<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Web avec Bootstrap et Fond d'Image</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <img alt="Background Image" class="background-image" src="https://www.bungie.net/img/destiny_content/pgcr/lotus.jpg">
        <div class="overlay"></div>
        <div class="top-title">
            <div class="background-image-container">
                <img alt="Sector-Icon" class="toptitle-background-image" src="https://www.bungie.net/common/destiny2_content/icons/DestinyActivityModeDefinition_7d11acd7d5a3daebc0a0c906452932d6.png"/>
            </div>
            <p class="activity-type animated fadeInRight delay-1">SECTEUR OUBLIE</p>
            <h1 class="activity-name animated fadeInRight delay-2">ACTIVITY-NAME</h1>
            <p class="activity-description animated fadeInRight delay-3">Place - Destination</p>
        </div>

        <div class="lostSector-info">
            <div class="Expert-section">
            </div>
            <div class="Master-section">
            </div>
        </div>
    </div>
</body>
</html>
