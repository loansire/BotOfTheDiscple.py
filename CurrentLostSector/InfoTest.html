<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Modifiers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .lostSector-info {
            display: flex;
            justify-content: flex-start;
            width: auto;
        }
        .section {
            display: flex;
            flex-wrap: wrap;
            background-color: #333333;
            padding: 20px;
            border-radius: 8px;
            width: auto;
        }
        .section h2 {
            width: 100%;
            margin-top: 0;
        }
        .info {
            display: flex;
            align-items: center;
            margin: 10px;
        }
        .info img {
            width: 24px;
            height: 24px;
            margin-right: 5px;
        }
        .count {
            font-size: 1.5rem;
            margin-right: 10px;
            font-weight: bold;
        }
        .solar {
            color: #f0631e;
        }
        .void {
            color: #b185df;
        }
        .arc {
            color: #7aecf3;
        }
    </style>
</head>
<body>
    <div class="lostSector-info">
        <div class="section">
            <h2>Expert</h2>
            <div class="info"><img src="https://www.bungie.net/common/destiny2_content/icons/DestinyDamageTypeDefinition_092d066688b879c807c3b460afdd61e6.png" alt="Cryo Icon"><span class="count arc">4 </span>Cryo-électriques</div>
            <div class="info"><img src="https://www.bungie.net/common/destiny2_content/icons/DestinyDamageTypeDefinition_ceb2f6197dccf3958bb31cc783eb97a0.png" alt="Void Icon"><span class="count void">2 </span>Solaires</div>
            <div class="info"><img src="https://www.bungie.net/common/destiny2_content/icons/DestinyDamageTypeDefinition_2a1773e10968f2d088b97c22b22bba9e.png" alt="Solar Icon"><span class="count solar">5 </span>Cryo-électriques</div>
            <div class="info"><img src="https://www.bungie.net/common/destiny2_content/icons/DestinyBreakerTypeDefinition_825a438c85404efd6472ff9e97fc7251.png" alt="Chancellement Icon"><span class="count">5 </span>Implacables</div>
            <div class="info"><img src="https://www.bungie.net/common/destiny2_content/icons/DestinyBreakerTypeDefinition_da558352b624d799cf50de14d7cb9565.png" alt="Perturbation Icon"><span class="count">5 </span>Surchargés</div>
        </div>
    </div>
</body>
</html>
