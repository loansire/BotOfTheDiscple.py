<!DOCTYPE html>
<html lang="fr">

    <style>

            padding: 0;
            background-image: url('Resources/Prisma/Titan_BG.png');
            background-size: cover;
            font-family: Arial, sans-serif;
            color: white;
        }
        .container {

            margin-bottom: 10px;
        }
        .trans-border {

            height: 100px;
            border: 2px solid rgba(255, 255, 255, 0.25);

            margin-right: 10px;

        .trans-border img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .aspect-div {
            left: 759.347px;
            top: 591.671px;
            width: 219px;
            height: 185.834px;
        }
        .aspect-title {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .aspect-line {
            width: 219px;
            height: 2px;
            background-color: white;
            margin-bottom: 10px;
        }
        .aspect-border {
            width: 100px;
            height: 100px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            display: inline-block;
            margin-right: 10px;
        }
        .aspect-border img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

            background-repeat: no-repeat;
            opacity: 0.25;
            transform: rotate(45deg);
            position: relative;

            </div>
        </div>

            </div>
        </div>
    </div>

</html>
