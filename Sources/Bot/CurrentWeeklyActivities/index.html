<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activités Destiny</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-left: 200px;
            margin-right: 200px;
        }
        .card {
            width: calc(25% - 20px);
            min-width: 250px;
            height: 150px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card-count {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
        }
        .rewards-container {
            position: absolute;
            top: 5px;
            left: 5px;
            display: flex;
            gap: 3px;
        }
        .reward-icon {
            width: 25px;
            height: 25px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            padding: 2px;
        }
        .reward-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        @media (max-width: 1200px) {
            .card {
                width: calc(33.33% - 20px);
            }
        }
        @media (max-width: 800px) {
            .card {
                width: calc(50% - 20px);
            }
        }
        @media (max-width: 600px) {
            .card {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="activities-container">
        <!-- Les cartes seront générées ici -->
    </div>
    <script>
        // Charge le fichier data.json
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('activities-container');
                // Récupère toutes les activités et les trie par index
                const activities = Object.values(data);
                activities.sort((a, b) => a.index - b.index);
                // Regroupe les activités par nom
                const groupedActivities = {};
                activities.forEach(activity => {
                    if (!groupedActivities[activity.name]) {
                        groupedActivities[activity.name] = [];
                    }
                    groupedActivities[activity.name].push(activity);
                });
                // Parcourt chaque groupe d'activités
                Object.entries(groupedActivities).forEach(([name, group]) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    // Utilise l'URL complète pour les images (on prend la première image du groupe)
                    const imgUrl = `https://www.bungie.net${group[0].pgcrImage}`;
                    // Crée le contenu de la carte
                    let rewardsHTML = '';
                    if (group[0].rewards && group[0].rewards.length > 0) {
                        rewardsHTML = `
                            <div class="rewards-container">
                                ${group[0].rewards.map(reward =>
                                    `<div class="reward-icon"><img src="https://www.bungie.net${reward}" alt="Récompense"></div>`
                                ).join('')}
                            </div>
                        `;
                    }
                    card.innerHTML = `
                        <img src="${imgUrl}" alt="${name}">
                        ${rewardsHTML}
                        <div class="card-title">${name}</div>
                        ${group.length > 1 ? `<div class="card-count">${group.length}</div>` : ''}
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Erreur lors du chargement du fichier JSON :', error);
                document.getElementById('activities-container').innerHTML =
                    '<p style="color: white; text-align: center;">Erreur lors du chargement des données.</p>';
            });
    </script>
</body>
</html>
