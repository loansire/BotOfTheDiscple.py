<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aujourd'hui dans Destiny 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding-left: 1000px;
            padding-right: 1000px;
            background-color: #1a1a1a;
            color: white;
        }

        h1 {
            text-align: CENTER;
            font-size: 2.5em;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .container {
            display: grid;
            gap: 15px;
            justify-content: center;
            grid-template-columns: repeat(3, minmax(180px, 1fr));
        }

        .card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            background-color: #2a2a2a; /* fond de carte sombre */
            text-align: center;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.4);
        }

        .card img {
            width: 64px;
            height: 64px;
            margin-bottom: 10px;
            object-fit: contain; /* s’adapte sans couper ni déformer */
            background-color: #2a2a2a; /* fond neutre pour images non carrées */
            border-radius: 8px;
            padding: 5px;
        }

        .card span {
            font-size: 1.2em;
            font-weight: bold;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Aujourd'hui dans Destiny 2</h1>
    <div class="container">
        <a class="card" href="Raids.html">
            <img src="Portal_Ico/raid.png" alt="Raids">
            <span>Raids</span>
        </a>
        <a class="card" href="Dungeons.html">
            <img src="Portal_Ico/dungeon.png" alt="Donjons">
            <span>Donjons</span>
        </a>
        <a class="card" href="LostSectors.html">
            <img src="Portal_Ico/lostsector.png" alt="Secteur Oubliés">
            <span>Secteur Oubliés</span>
        </a>
        <a class="card" href="ExoticMissions.html">
            <img src="Portal_Ico/exoticmission.png" alt="Missions Exotiques">
            <span>Missions Exotiques</span>
        </a>
        <a class="card" href="SoloOps.html">
            <img src="Portal_Ico/soloops.png" alt="Opération Solo">
            <span>Opération Solo</span>
        </a>
        <a class="card" href="PinnacleOps.html">
            <img src="Portal_Ico/pinnacleops.png" alt="Opération Préstige">
            <span>Opération Préstige</span>
        </a>
    </div>
</body>
</html>
