<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donjons - Destiny</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding-left: 200px;
      padding-right: 200px;
      background-color: #1a1a1a;
      color: white;
    }

    h1 {
      text-align: left;
      font-size: 2.5em;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .container {
      display: grid;
      gap: 15px;
      justify-content: center;
      grid-template-columns: repeat(3, minmax(240px, 1fr));
    }

    .card {
      position: relative;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.1s;
      background: #000;
      height: 300px;
    }

    .card::after {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(0,0,0,0.0) 50%, rgba(0,0,0,0.25) 100%);
      pointer-events: none;
    }

    .card:hover {
      transform: scale(0.98);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-content {
      position: absolute;
      top: 15px;
      left: 15px;
    }

    .card-subtitle {
      font-size: 1.5em;
      opacity: 0.7;
      margin-bottom: 3px;
    }

    .card-title {
      font-size: 2.5em;
      font-weight: bold;
      line-height: 1.2;
    }

    .rewards-container {
      position: absolute;
      bottom: 15px;
      left: 15px;
      display: flex;
      gap: 15px;
    }

    .reward-wrapper {
      position: relative;
      width: 75px;
      height: 75px;
    }

    .reward-icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
    }

    .reward-icon[src$=".jpg"],
    .reward-icon[src$=".jpeg"] {
      border: 1px solid white;
    }

    .reward-quantity {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 20px;
      height: 20px;
      background: gray; /* blanc cassé */
      color: white;        /* texte noir */
      font-size: 15px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <h1>Donjons</h1>
  <div class="container" id="raids-container"></div>

<script>
  // Fonction de copie
  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      console.error('Erreur lors de la copie : ', err);
    }
  }

  fetch('../../activities/Dungeons.json')
    .then(response => response.json())
    .then(data => {
      const container = document.getElementById('raids-container');

      // Filtrer les activités qui ont des rewards
      const activitiesWithRewards = data.filter(activity => activity.rewards && activity.rewards.length > 0);

      // Trier par index croissant
      activitiesWithRewards.sort((a, b) => (a.index || 0) - (b.index || 0));

      function createCard(activity) {
        const card = document.createElement('div');
        card.className = 'card';
        card.tabIndex = 0;

        const imgUrl = `https://www.bungie.net${activity.pgcrImage}`;

        const rewardIconsHTML = activity.rewards.map(reward => {
          return `
            <div class="reward-wrapper" title="${reward.rewardName}">
              <img src="https://www.bungie.net${reward.icon}"
                   class="reward-icon"
                   data-itemhash="${reward.itemHash}"
                   alt="Récompense">
              <div class="reward-quantity">${reward.quantity}</div>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <img src="${imgUrl}" alt="${activity.name}">
          <div class="card-content">
            <div class="card-subtitle">${activity.activityTypeName || ''}</div>
            <div class="card-title">${activity.name}</div>
          </div>
          <div class="rewards-container">${rewardIconsHTML}</div>
        `;

        // Copier le hash activité
        card.addEventListener('click', () => {
          copyToClipboard(activity.activityHash?.toString() || '');
        });

        // Copier itemHash au clic sur reward
        card.querySelectorAll('.reward-icon').forEach(icon => {
          icon.addEventListener('click', (e) => {
            e.stopPropagation();
            copyToClipboard(icon.dataset.itemhash);
          });
        });

        return card;
      }

      activitiesWithRewards.forEach(activity => container.appendChild(createCard(activity)));
    })
    .catch(error => {
      console.error('Erreur :', error);
      document.getElementById('raids-container').innerHTML =
        '<p style="color: white; text-align: center;">Erreur de chargement.</p>';
    });
</script>
</body>
</html>
