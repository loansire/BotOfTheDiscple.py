<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missions Exotiques - Destiny</title>
  <style>
    :root {
      --bg: #0f0f10;
      --fg: #ffffff;
      --muted: #b8b8b8;
      --card: #000000;
      --accent: #2dd4bf;
      --tooltip-bg: #111318;
      --tooltip-border: #2a2d38;
    }
    * { box-sizing: border-box; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      margin: 0;
      padding: 48px 200px;
      background-color: var(--bg);
      color: var(--fg);
    }
    h1 {
      text-align: left;
      font-size: 2.25rem;
      margin: 0 0 24px 0;
      letter-spacing: .5px;
      font-weight: 800;
    }
    .container {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
    }
    .card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.1s;
      background: var(--card);
      height: 300px;
      box-shadow: 0 10px 20px rgba(0,0,0,.35);
      outline: 1px solid rgba(255,255,255,.06);
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 60% 40%, rgba(0,0,0,0.0) 35%, rgba(0,0,0,0.35) 100%);
      pointer-events: none;
    }
    .card:hover { transform: translateY(-1px) scale(0.985); }
    .card img.bg {
      width: 100%; height: 100%; object-fit: cover; display: block;
      filter: saturate(1.05) contrast(1.05);
    }
    .card-content { position: absolute; top: 14px; left: 14px; right: 14px; }
    .card-subtitle { font-size: 1rem; opacity: 0.8; margin-bottom: 4px; color: var(--muted); }
    .card-title { font-size: 1.85rem; font-weight: 900; line-height: 1.2; }

    .weapon-container {
      position: absolute;
      bottom: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .weapon-wrapper { position: relative; width: 80px; height: 80px; }
    .weapon-icon {
      width: 100%; height: 100%; object-fit: contain; display: block;
      outline: 1px solid rgba(255,255,255,1);
    }

    .tooltip {
      position: absolute; z-index: 10; min-width: 260px; max-width: 320px;
      background: var(--tooltip-bg);
      border: 1px solid var(--tooltip-border);
      border-radius: 12px; padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.55);
      display: none;
      color: var(--fg);
    }
    .tooltip.visible { display: block; }
    .tooltip .row { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: start; }
    .tooltip .meta { display: grid; gap: 4px; }
    .tooltip .name { font-weight: 800; font-size: 1rem; line-height: 1.15; }
    .tooltip .type, .tooltip .foundry { font-size: .9rem; color: var(--muted); }
    .tooltip .links { margin-top: 6px; display:flex; gap:12px; align-items:center; }
    .tooltip .links a { color: var(--accent); text-decoration: none; font-size: .9rem; display:flex; align-items:center; gap:4px; }
    .tooltip .links a:hover { text-decoration: underline; }
    .flag { font-size:1rem; }
  </style>
</head>
<body>
  <h1>Missions Exotiques</h1>
  <div class="container" id="raids-container"></div>

  <script>
    async function copyToClipboard(text) {
      if (!text) return;
      try { await navigator.clipboard.writeText(text); }
      catch (err) { console.error('Erreur lors de la copie : ', err); }
    }

    function attachHoverTooltip(iconEl, tooltipEl) {
      let hideTimer = null;
      function show() {
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
        tooltipEl.classList.add('visible');
      }
      function scheduleHide() {
        hideTimer = setTimeout(() => tooltipEl.classList.remove('visible'), 120);
      }
      function positionTooltip() {
        const rect = iconEl.getBoundingClientRect();
        const scrollY = window.scrollY || document.documentElement.scrollTop;
        const scrollX = window.scrollX || document.documentElement.scrollLeft;
        tooltipEl.style.left = (scrollX + rect.left + rect.width + 12) + 'px';
        tooltipEl.style.top  = (scrollY + rect.top - 6) + 'px';
      }
      iconEl.addEventListener('mouseenter', () => { positionTooltip(); show(); });
      iconEl.addEventListener('mouseleave', scheduleHide);
      tooltipEl.addEventListener('mouseenter', show);
      tooltipEl.addEventListener('mouseleave', scheduleHide);
      window.addEventListener('scroll', () => { if (tooltipEl.classList.contains('visible')) positionTooltip(); });
      window.addEventListener('resize', () => { if (tooltipEl.classList.contains('visible')) positionTooltip(); });
    }

    fetch('../activities/ExoticMissions.json')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('raids-container');
        data.sort((a, b) => (a.index || 0) - (b.index || 0));

        function createCard(activity) {
          const card = document.createElement('div');
          card.className = 'card';
          card.tabIndex = 0;
          const bgUrl = `https://www.bungie.net${activity.pgcrImage}`;

          const weapon = activity.weapon || null;

          card.innerHTML = `
            <img class="bg" src="${bgUrl}" alt="${activity.name}">
            <div class="card-content">
              <div class="card-subtitle">${activity.activityTypeName || ''}</div>
              <div class="card-title">${activity.name}</div>
            </div>
            <div class="weapon-container"></div>
          `;

          const weaponZone = card.querySelector('.weapon-container');

          if (weapon && weapon.icon) {
            const wrap = document.createElement('div');
            wrap.className = 'weapon-wrapper';
            const icon = document.createElement('img');
            icon.className = 'weapon-icon';
            icon.src = `https://www.bungie.net${weapon.icon}`;
            icon.alt = weapon.name || 'Arme exotique';
            icon.loading = 'lazy';
            icon.decoding = 'async';

            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip';
            tooltip.innerHTML = `
              <div class="row">
                <img src="https://www.bungie.net${weapon.icon}" alt="${weapon.name || ''}" style="width:80px;height:80px;border-radius:10px;object-fit:contain;outline:1px solid rgba(255,255,255,.12);background:#090b10;" />
                <div class="meta">
                  <div class="name">${weapon.name || 'Inconnu'}</div>
                  <div class="type">${weapon.type || ''}</div>
                  <div class="links">
                    ${[weapon.lightgg ? `<a href="${weapon.lightgg}" target="_blank" rel="noopener noreferrer">Light.gg</a>` : null,
                       weapon.foundry ? `<a href="${weapon.foundry}" target="_blank" rel="noopener noreferrer"></span>D2foundry</a>` : null]
                      .filter(Boolean)
                      .join(' | ')}
                  </div>
                </div>
              </div>
            `;

            document.body.appendChild(tooltip);
            attachHoverTooltip(icon, tooltip);

            icon.addEventListener('click', (e) => {
              e.stopPropagation();
              copyToClipboard(String(weapon.hash || ''));
            });

            wrap.appendChild(icon);
            weaponZone.appendChild(wrap);
          } else {
            const span = document.createElement('span');
            span.style.opacity = .7;
            span.textContent = 'Aucune arme liée';
            weaponZone.appendChild(span);
          }

          card.addEventListener('click', () => {
            copyToClipboard(activity.activityHash?.toString() || '');
          });

          return card;
        }

        data.forEach(activity => container.appendChild(createCard(activity)));
      })
      .catch(err => {
        console.error('Erreur :', err);
        document.getElementById('raids-container').innerHTML = '<p style="color:white;text-align:center;">Erreur de chargement.</p>';
      });
  </script>
</body>
</html>
